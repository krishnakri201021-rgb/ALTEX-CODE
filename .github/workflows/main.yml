name: Windows EXE Build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    name: Build ALTREX CODE Windows EXE
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract application source from uploaded ZIP
        shell: pwsh
        run: |
          $archive = Join-Path $env:GITHUB_WORKSPACE 'ALTREX-CODE-READY.zip'
          if (-not (Test-Path $archive)) {
            throw 'ALTREX-CODE-READY.zip is missing from the repository root.'
          }
          $source = Join-Path $env:RUNNER_TEMP 'altrex-source'
          if (Test-Path $source) { Remove-Item $source -Recurse -Force }
          Expand-Archive -LiteralPath $archive -DestinationPath $source -Force
          Get-ChildItem -LiteralPath $source -Force | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination $env:GITHUB_WORKSPACE -Recurse -Force
          }
          if (-not (Test-Path (Join-Path $env:GITHUB_WORKSPACE 'package.json'))) {
            throw 'package.json was not extracted to the repository root.'
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build installer and portable EXE without publishing
        run: npm run dist -- --publish never

      - name: Upload Windows EXE files
        uses: actions/upload-artifact@v4
        with:
          name: ALTREX-CODE-Windows
          path: |
            dist/*.exe
          if-no-files-found: error
          retention-days: 14
